<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Robot Control Panel - MVP VLA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg-main: #0b1120;
    --bg-panel: #141e33;
    --bg-card: #1a2744;
    --border: #2a3a5c;
    --border-light: #3a4a6c;
    --text-main: #e8edf5;
    --text-muted: #8899bb;
    --text-light: #b0c4e8;
    --accent: #4f8cff;
    --accent-hover: #6ba0ff;
    --accent-glow: rgba(79, 140, 255, 0.15);
    --user-bg: #4f8cff;
    --agent-bg: #1a2744;
    --success: #34d399;
    --error: #f87171;
    --warning: #fbbf24;
    --info: #60a5fa;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body { 
    margin: 0; 
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
    background: var(--bg-main); 
    color: var(--text-main); 
    height: 100vh; 
    overflow: hidden; 
  }
  
  #app { 
    display: flex; 
    height: 100vh; 
    flex-direction: row; 
    gap: 0;
  }
  
  /* ===== LEFT PANEL ===== */
  #left { 
    flex: 1; 
    display: flex; 
    flex-direction: column; 
    background: var(--bg-panel); 
    border-right: 1px solid var(--border); 
    box-shadow: 4px 0 30px rgba(0,0,0,0.3); 
    z-index: 10;
    position: relative;
  }

  /* Header */
  .panel-header {
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(11, 17, 32, 0.5);
    backdrop-filter: blur(8px);
  }

  .panel-header .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .panel-header .brand .logo {
    width: 36px;
    height: 36px;
    background: var(--accent);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    color: white;
    box-shadow: 0 4px 12px var(--accent-glow);
  }

  .panel-header .brand h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.3px;
    background: linear-gradient(135deg, #e8edf5 0%, #8899bb 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .panel-header .badge {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--bg-card);
    padding: 4px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* Log area */
  #log { 
    flex: 1; 
    overflow-y: auto; 
    padding: 20px 24px; 
    display: flex; 
    flex-direction: column; 
    gap: 12px; 
    scroll-behavior: smooth; 
    background: radial-gradient(ellipse at 50% 0%, rgba(79, 140, 255, 0.03) 0%, transparent 70%);
  }

  /* Welcome message */
  .welcome-msg {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
  }
  .welcome-msg .icon { font-size: 48px; margin-bottom: 16px; display: block; }
  .welcome-msg h2 { font-size: 20px; font-weight: 500; color: var(--text-light); margin-bottom: 8px; }
  .welcome-msg p { font-size: 14px; line-height: 1.6; max-width: 400px; margin: 0 auto; }

  /* ===== MESSAGES ===== */
  .line { 
    padding: 14px 20px; 
    border-radius: 14px; 
    max-width: 88%; 
    line-height: 1.6; 
    word-wrap: break-word; 
    font-size: 14.5px; 
    box-shadow: 0 2px 8px rgba(0,0,0,0.15); 
    animation: fadeIn 0.35s ease-out;
    position: relative;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .user { 
    background: var(--user-bg); 
    align-self: flex-end; 
    border-bottom-right-radius: 4px; 
    white-space: pre-wrap;
    box-shadow: 0 4px 16px rgba(79, 140, 255, 0.2);
  }
  
  .agent { 
    background: var(--agent-bg); 
    align-self: flex-start; 
    border-bottom-left-radius: 4px; 
    white-space: pre-wrap;
    border: 1px solid var(--border);
  }

  /* ===== STEP CARDS (tool call + result gộp làm 1) ===== */
  .step {
    align-self: stretch;
    max-width: 100%;
    margin: 2px 0;
    border-radius: 12px;
    padding: 12px 16px;
    box-shadow: none;
    border: 1px solid var(--border);
    background: var(--bg-card);
    border-left: 3px solid var(--border-light);
    transition: all 0.25s ease;
  }

  .step-header {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .step-icon {
    font-size: 18px;
    flex-shrink: 0;
    line-height: 1;
  }

  .step-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .step-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
  }

  .step-summary {
    font-size: 14px;
    color: var(--text-light);
    line-height: 1.4;
  }

  .step-status {
    font-size: 16px;
    flex-shrink: 0;
  }

  .step.pending .step-status { animation: spin-pulse 1.2s ease-in-out infinite; }
  @keyframes spin-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .step-details {
    margin-top: 8px;
  }
  .step-details summary {
    cursor: pointer;
    font-size: 11.5px;
    color: var(--text-muted);
    list-style: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    user-select: none;
  }
  .step-details summary::-webkit-details-marker { display: none; }
  .step-details summary::before {
    content: '▸';
    transition: transform 0.15s;
  }
  .step-details[open] summary::before { transform: rotate(90deg); }
  .step-details summary:hover { color: var(--text-light); }
  .step-details pre {
    margin-top: 8px;
    font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 12px;
    white-space: pre-wrap;
    overflow-x: auto;
    color: var(--text-muted);
    background: rgba(0,0,0,0.15);
    border-radius: 8px;
    padding: 10px 12px;
  }

  /* Status colors */
  .step.status-RUNNING { border-left-color: var(--warning); }
  .step.status-RUNNING .step-summary { color: var(--warning); }
  .step.status-DONE { border-left-color: var(--success); }
  .step.status-DONE .step-summary { color: var(--success); }
  .step.status-FAILED_MAX_RETRY, .step.status-SAFETY_STOP, .step.status-TIMEOUT, .step.status-ABORTED {
    border-left-color: var(--error);
  }
  .step.status-FAILED_MAX_RETRY .step-summary,
  .step.status-SAFETY_STOP .step-summary,
  .step.status-TIMEOUT .step-summary,
  .step.status-ABORTED .step-summary { color: var(--error); }
  .step.status-ROBOT_BUSY { border-left-color: var(--info); }
  .step.status-ROBOT_BUSY .step-summary { color: var(--info); }

  /* ===== INPUT BAR ===== */
  #inputbar { 
    display: flex; 
    padding: 16px 24px; 
    background: rgba(11, 17, 32, 0.8);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border); 
    gap: 12px; 
    align-items: center; 
  }
  
  #msg { 
    flex: 1; 
    padding: 14px 22px; 
    background: var(--bg-card); 
    color: var(--text-main); 
    border: 1px solid var(--border); 
    border-radius: 30px; 
    font-size: 15px; 
    transition: all 0.25s ease;
    font-family: inherit;
  }
  
  #msg:focus { 
    outline: none; 
    border-color: var(--accent); 
    box-shadow: 0 0 0 4px var(--accent-glow); 
    background: var(--bg-main);
  }
  
  #msg::placeholder {
    color: var(--text-muted);
    opacity: 0.6;
  }

  .btn {
    padding: 12px 28px;
    border: none;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .btn-primary {
    background: var(--accent);
    color: white;
    box-shadow: 0 4px 16px var(--accent-glow);
  }
  .btn-primary:hover { 
    background: var(--accent-hover); 
    transform: translateY(-1px);
    box-shadow: 0 6px 24px rgba(79, 140, 255, 0.3);
  }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .btn-secondary {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { 
    border-color: var(--warning); 
    color: var(--warning); 
    background: rgba(251, 191, 36, 0.05);
  }
  .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn .icon { font-size: 16px; }

  /* ===== RIGHT PANEL ===== */
  #right { 
    width: 420px; 
    padding: 20px 24px 24px; 
    display: flex; 
    flex-direction: column; 
    background: var(--bg-main); 
    gap: 16px;
  }

  .camera-section {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .camera-section .section-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .camera-section .section-label span {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .camera-section .section-label .live-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: var(--error);
    border-radius: 50%;
    animation: pulse-dot 1.5s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.8); }
  }

  #mjpeg { 
    width: 100%; 
    border-radius: 16px; 
    border: 1px solid var(--border); 
    box-shadow: var(--shadow); 
    background: #000; 
    object-fit: cover; 
    aspect-ratio: 4/3; 
    transition: opacity 0.3s;
  }

  .camera-status {
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    padding: 8px 0 4px;
    opacity: 0.6;
  }

  /* Quick commands */
  .quick-commands {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 4px;
  }

  .quick-commands .chip {
    padding: 6px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .quick-commands .chip:hover {
    border-color: var(--accent);
    color: var(--text-main);
    background: var(--accent-glow);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 850px) {
    #app { flex-direction: column-reverse; }
    #right { 
      width: 100%; 
      border-bottom: 1px solid var(--border); 
      padding: 16px 20px; 
      height: auto;
      max-height: 40vh;
    }
    #left { height: 100%; }
    #mjpeg { max-height: 30vh; aspect-ratio: auto; }
    .panel-header .brand h1 { font-size: 15px; }
    .panel-header .badge { display: none; }
    .line { max-width: 95%; font-size: 14px; }
  }

  @media (max-width: 500px) {
    #inputbar { flex-wrap: wrap; padding: 12px 16px; }
    #msg { font-size: 14px; padding: 12px 16px; }
    .btn { padding: 10px 18px; font-size: 13px; }
    .quick-commands .chip { font-size: 11px; padding: 4px 12px; }
    #right { padding: 12px 16px; }
    .panel-header { padding: 12px 16px; }
    .panel-header .brand .logo { width: 30px; height: 30px; font-size: 14px; }
  }
</style>
</head>
<body>
<div id="app">
  <!-- LEFT: Chat -->
  <div id="left">
    <div class="panel-header">
      <div class="brand">
        <div class="logo">R</div>
        <h1>Robot Control</h1>
      </div>
      <span class="badge">● Live</span>
    </div>

    <div id="log">
      <div class="welcome-msg">
        <span class="icon">🤖</span>
        <h2>Chào mừng bạn!</h2>
        <p>Hãy nhập lệnh điều khiển robot bên dưới.<br>Ví dụ: <em>"bỏ hộp sữa vào giỏ"</em></p>
      </div>
    </div>

    <div id="inputbar">
      <input id="msg" placeholder="Nhập yêu cầu của bạn..." autocomplete="off" autofocus>
      <button class="btn btn-primary" id="send">Gửi</button>
      <button class="btn btn-secondary" id="gohome" title="Đưa tay robot về vị trí home">⌂ Home</button>
    </div>
  </div>

  <!-- RIGHT: Camera -->
  <div id="right">
    <div class="camera-section">
      <div class="section-label">
        <span><span class="live-dot"></span> Camera trực tiếp</span>
        <span style="font-weight:400;font-size:11px;color:var(--text-muted);">MJPEG</span>
      </div>
      <img id="mjpeg" src="http://localhost:8931/mjpeg" onerror="this.style.opacity=0.3; this.alt='📷 Camera không khả dụng'">
      <div class="camera-status">Đang kết nối đến luồng video</div>
    </div>

    <div class="quick-commands">
      <button class="chip" data-cmd="mở tay">✋ Mở tay</button>
      <button class="chip" data-cmd="đóng tay">👊 Đóng tay</button>
      <button class="chip" data-cmd="về nhà">🏠 Về nhà</button>
      <button class="chip" data-cmd="dừng lại">⏹ Dừng</button>
    </div>
  </div>
</div>

<script>
const log = document.getElementById("log");
const msgInput = document.getElementById("msg");
const sendBtn = document.getElementById("send");
const gohomeBtn = document.getElementById("gohome");
const threadId = crypto.randomUUID();

// ===== HELPERS =====
function addLine(cls, htmlContent) {
  // Xóa welcome message nếu có
  const welcome = log.querySelector('.welcome-msg');
  if (welcome) welcome.remove();

  const div = document.createElement("div");
  div.className = "line " + cls;
  div.innerHTML = htmlContent;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function statusClass(status) {
  return status ? ("status-" + status) : "";
}

function escapeHtml(unsafe) {
  return (unsafe || '').toString()
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

// ===== FRIENDLY TOOL LABELS =====
// Diễn giải tool call/result kỹ thuật (JSON) thành 1 dòng tiếng Việt dễ hiểu cho
// người dùng cuối; JSON gốc vẫn xem được qua <details> "Chi tiết kỹ thuật".
function describeStatus(r) {
  const step = (r.step != null) ? ` (bước ${r.step})` : "";
  switch (r.status) {
    case "RUNNING": return `Đang thực hiện...${step}`;
    case "DONE": return r.success ? "Hoàn thành, đã thành công ✅" : "Xong nhưng chưa đạt yêu cầu — đang xem lại ảnh...";
    case "FAILED_MAX_RETRY": return "Thử nhiều lần vẫn chưa được, tay đã lùi về vị trí an toàn";
    case "SAFETY_STOP": return `Dừng khẩn cấp vì lý do an toàn${r.reason ? ": " + r.reason : ""}`;
    case "TIMEOUT": return "Hết thời gian chờ phản hồi";
    case "ABORTED": return "Đã hủy thao tác";
    case "ROBOT_BUSY": return "Robot đang bận với thao tác khác";
    default: return r.status || "Đã xử lý xong";
  }
}

const TOOL_META = {
  get_robot_state: {
    icon: "🔍", label: "Kiểm tra trạng thái robot",
    call: () => "Đang kiểm tra robot đang rảnh hay bận...",
    result: (r) => r.busy ? "Robot đang bận với một thao tác khác" : "Robot đang rảnh, sẵn sàng nhận lệnh",
  },
  capture: {
    icon: "📸", label: "Chụp ảnh camera",
    call: () => "Đang chụp ảnh hiện trường...",
    result: () => "Đã chụp ảnh xong",
  },
  take_action: {
    icon: "🤖", label: "Thực hiện thao tác",
    call: (a) => `Bắt đầu: "${a && a.subgoal ? a.subgoal : "..."}"${a && a.k ? ` (tối đa ${a.k} bước)` : ""}`,
    result: () => "Đã bắt đầu — đang theo dõi tiến độ...",
  },
  check_status: {
    icon: "⏳", label: "Theo dõi tiến độ",
    call: (a) => `Đang chờ cập nhật${a && a.wait_s ? ` (tối đa ${a.wait_s}s)` : ""}...`,
    result: describeStatus,
  },
  check_success: {
    icon: "🔎", label: "Kiểm tra kết quả",
    call: () => "Đang kiểm tra đã hoàn thành hay chưa...",
    result: (r) => r.success ? "Đã hoàn thành thành công ✅" : "Chưa đạt yêu cầu",
  },
  go_home: {
    icon: "🏠", label: "Về vị trí home",
    call: () => "Đang đưa tay robot về vị trí home...",
    result: (r) => (r.error || (r.status && r.status !== "DONE")) ? describeStatus(r) : "Đã về vị trí home",
  },
  abort: {
    icon: "🚫", label: "Dừng thao tác",
    call: () => "Đang dừng thao tác hiện tại...",
    result: () => "Đã dừng thao tác",
  },
  reset_episode: {
    icon: "🔄", label: "Đặt lại scene",
    call: () => "Đang đặt lại scene mô phỏng...",
    result: () => "Đã đặt lại scene",
  },
};

function metaOf(name) {
  return TOOL_META[name] || {
    icon: "⚙️", label: name,
    call: () => "Đang thực hiện...",
    result: (r) => describeStatus(r) || "Đã xử lý xong",
  };
}

const STATUS_ICONS = {
  DONE: "✅", RUNNING: "⏳", FAILED_MAX_RETRY: "❌",
  SAFETY_STOP: "🛑", TIMEOUT: "⏰", ABORTED: "🚫", ROBOT_BUSY: "🔄",
};

// FIFO các step đang chờ kết quả — tools_node ở server chạy tuần tự nên thứ tự
// tool_call/tool_result khớp nhau theo đúng thứ tự phát sinh.
const pendingSteps = [];

function renderStepCall(name, args) {
  const meta = metaOf(name);
  const div = addLine("step pending", `
    <div class="step-header">
      <span class="step-icon">${meta.icon}</span>
      <div class="step-body">
        <span class="step-title">${escapeHtml(meta.label)}</span>
        <span class="step-summary">${escapeHtml(meta.call(args))}</span>
      </div>
      <span class="step-status">⏳</span>
    </div>
    <details class="step-details">
      <summary>Chi tiết kỹ thuật</summary>
      <pre>${escapeHtml(JSON.stringify(args || {}, null, 2))}</pre>
    </details>
  `);
  pendingSteps.push({ name, div });
  return div;
}

function renderStepResult(name, result) {
  const r = result || {};
  const meta = metaOf(name);

  // Tìm step đang chờ khớp tên (FIFO); nếu không có (vd lỗi thứ tự) thì tạo mới.
  let entry = null;
  const idx = pendingSteps.findIndex((s) => s.name === name);
  if (idx !== -1) entry = pendingSteps.splice(idx, 1)[0];

  const div = entry ? entry.div : renderStepCall(name, {});
  div.classList.remove("pending");
  if (r.status) div.classList.add(statusClass(r.status));

  div.querySelector(".step-summary").textContent = meta.result(r);
  div.querySelector(".step-status").textContent = STATUS_ICONS[r.status] || "✅";

  const pre = div.querySelector(".step-details pre");
  pre.textContent += "\n\n— Kết quả —\n" + JSON.stringify(r, null, 2);

  return div;
}

// ===== SEND MESSAGE =====
async function sendMessage() {
  const text = msgInput.value.trim();
  if (!text) return;
  msgInput.value = "";
  
  sendBtn.disabled = true;
  sendBtn.style.opacity = "0.7";

  addLine("user", "🧑 " + escapeHtml(text));
  let agentDiv = null;

  try {
    const resp = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, thread_id: threadId }),
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true }).replace(/\r\n/g, "\n");

      let idx;
      while ((idx = buf.indexOf("\n\n")) !== -1) {
        const block = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        handleEventBlock(block);
      }
    }
  } catch (error) {
    addLine("tool_result status-FAILED_MAX_RETRY", "⚠️ Lỗi kết nối tới máy chủ.");
  } finally {
    sendBtn.disabled = false;
    sendBtn.style.opacity = "1";
    msgInput.focus();
  }

  function handleEventBlock(block) {
    let event = "message", data = "";
    for (const line of block.split("\n")) {
      if (line.startsWith("event:")) event = line.slice(6).trim();
      else if (line.startsWith("data:")) data += line.slice(5).trim();
    }
    if (!data) return;
    let payload;
    try { payload = JSON.parse(data); } catch { return; }

    if (event === "agent_text") {
      if (!agentDiv) {
        agentDiv = document.createElement("div");
        agentDiv.className = "line agent";
        agentDiv.textContent = "🤖 ";
        log.appendChild(agentDiv);
        const welcome = log.querySelector('.welcome-msg');
        if (welcome) welcome.remove();
      }
      agentDiv.textContent += payload.text;
      log.scrollTop = log.scrollHeight;
    } else if (event === "tool_call") {
      agentDiv = null;
      renderStepCall(payload.name, payload.args);
    } else if (event === "tool_result") {
      agentDiv = null;
      renderStepResult(payload.name, payload.result);
    } else if (event === "done") {
      agentDiv = null;
    }
  }
}

// ===== GO HOME =====
async function goHome() {
  gohomeBtn.disabled = true;
  renderStepCall("go_home", {});
  try {
    const resp = await fetch("/go_home", { method: "POST" });
    const result = await resp.json();
    renderStepResult("go_home", result);
  } catch (error) {
    renderStepResult("go_home", { status: "SAFETY_STOP", reason: "Lỗi kết nối tới máy chủ" });
  } finally {
    gohomeBtn.disabled = false;
  }
}

// ===== QUICK COMMANDS =====
document.querySelectorAll('.chip[data-cmd]').forEach(chip => {
  chip.addEventListener('click', () => {
    const cmd = chip.dataset.cmd;
    msgInput.value = cmd;
    sendMessage();
  });
});

// ===== EVENT LISTENERS =====
sendBtn.addEventListener("click", sendMessage);
gohomeBtn.addEventListener("click", goHome);

msgInput.addEventListener("keydown", (e) => { 
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage(); 
  }
});

// Focus input on load
setTimeout(() => msgInput.focus(), 300);
</script>
